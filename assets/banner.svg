<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 22px; fill: #94a3b8; }
    .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(180px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .pulsing-glow { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .scan-line { animation: scan 3.5s infinite ease-in-out; }
    .spinning-ring { animation: spinRing 20s linear infinite; transform-origin: 150px 180px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="360" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="16"/>

  <!-- Dynamic Glowing Background Circles -->
  <circle cx="150" cy="180" r="140" fill="#4facfe" opacity="0.15" class="pulsing-glow" filter="url(#glow)"/>
  <circle cx="1050" cy="100" r="180" fill="#c084fc" opacity="0.1" class="pulsing-glow" filter="url(#glow)"/>

  <!-- Tech Grid Accent Lines -->
  <path d="M 0,90 L 1200,90 M 0,180 L 1200,180 M 0,270 L 1200,270" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M 300,0 L 300,360 M 600,0 L 600,360 M 900,0 L 900,360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Dynamic Identity Shield / Biometric Emblem -->
  <g transform="translate(30, 0)">
    <!-- Rotating Tech Ring -->
    <circle cx="150" cy="180" r="85" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 12 4 12" class="spinning-ring"/>
    <circle cx="150" cy="180" r="98" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="40 8"/>

    <!-- Shield Icon -->
    <path d="M 150 115 L 205 138 C 205 190 175 225 150 240 C 125 225 95 190 95 138 Z" fill="url(#shieldGrad)" opacity="0.85" filter="url(#glow)"/>
    
    <!-- Face Scan / Fingerprint Lock Overlay inside Shield -->
    <path d="M 135 155 A 15 15 0 0 1 165 155 M 130 170 A 22 22 0 0 1 170 170 M 138 185 A 12 12 0 0 1 162 185 M 150 195 L 150 205" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic Scanning Laser Line -->
    <line x1="90" y1="100" x2="210" y2="100" stroke="#00f2fe" stroke-width="3" class="scan-line" filter="url(#glow)"/>
  </g>

  <!-- Title & Subtitle Content -->
  <g transform="translate(250, 0)">
    <!-- Tag -->
    <text x="0" y="115" class="tag">🛡️ NEXT-GEN VERIFICATION &amp; EKYC ARCHITECTURE</text>
    
    <!-- Title -->
    <text x="0" y="175" class="title">Awesome Identity Proofing</text>
    
    <!-- Gradient Bar -->
    <rect x="0" y="198" width="620" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    
    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle">KYC/AML • Biometric Liveness • Document Forensics • Age Assurance</text>
    <text x="0" y="270" class="subtitle" font-size="16" fill="#64748b">A curated guide to open-source tools &amp; enterprise identity verification platforms</text>
  </g>
  
  <!-- Right Side Decorative Elements -->
  <g transform="translate(1000, 150)" opacity="0.6">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="35" cy="35" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 60 30 L 100 30 M 60 42 L 88 42" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 62 L 100 62" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
